#global:
#  scrape_interval: 2s
#  evaluation_interval: 2s

scrape_configs:
  - job_name: 'cadvisor'
    scrape_interval: 2s
    static_configs:
      - targets: 
        - cadvisor:8080
        
  - job_name: 'redis_metrics'
    scrape_interval: 2s
    static_configs:
      - targets: 
        - redis-exporter:9121

  - job_name: 'mongo_metrics'
    scrape_interval: 2s
    static_configs:
    - targets: 
      - mongo-exporter:9216

  - job_name: 'mssql_metrics'
    scrape_interval: 2s
    static_configs:
      - targets: 
        - mssql-exporter:4000
